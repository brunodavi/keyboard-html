apply plugin: 'com.android.application'

android {
    namespace APP_PACKAGE
    compileSdkVersion Integer.parseInt(ANDROID_COMPILE_SDK_VERSION)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        resValue "string", "app_name", APP_NAME.toString()
        manifestPlaceholders = [APP_NAME: APP_NAME.toString()]
        applicationId APP_PACKAGE
        versionName APP_VERSION
        versionCode Integer.parseInt(APP_VERSION_CODE)
        minSdkVersion Integer.parseInt(APP_MIN_SDK_VERSION)
        targetSdkVersion Integer.parseInt(APP_TARGET_SDK_VERSION)
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

// Sample keyboard packages (zip) dropped next to the debug APK so on-device
// smoke testing needs no manual zip building. Sources in src/test/sample-layouts.
def sampleLayout(String name) {
    tasks.register("sampleLayout${name.capitalize()}", Zip) {
        from "src/test/sample-layouts/${name}"
        archiveFileName = "${name}.zip"
        destinationDirectory = layout.buildDirectory.dir("outputs/apk/debug")
    }
}
def sampleLayoutTasks = ['red-test', 'mint-test'].collect { sampleLayout(it) }

tasks.matching { it.name == 'assembleDebug' }.configureEach {
    dependsOn sampleLayoutTasks
}
