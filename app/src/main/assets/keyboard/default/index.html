<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body {
    margin: 0; padding: 0;
    background: #1e1f20;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: sans-serif;
    -webkit-user-select: none;
    user-select: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #kb {
    display: flex; flex-direction: column; gap: 6px;
    overflow: hidden;
    padding: 6px 4px 8px;
  }
  .sheet { display: none; flex-direction: column; gap: 6px; }
  .sheet.active { display: flex; }
  .row { display: flex; gap: 5px; }
  button {
    flex: 1;
    height: 46px;
    font-size: 16px;
    color: #e8eaed;
    background: #333537;
    border: 0;
    border-radius: 6px;
    outline: none;
    font-family: sans-serif;
  }
  button.fn { background: #2b2d2f; font-size: 14px; }
  button.f15 { flex: 1.45; }
  button.space { flex: 4.6; font-size: 14px; }
  button.accent { background: #8ab4f8; color: #202124; }
  .lg {
    display: grid;
    grid-template-columns: repeat(20, 1fr);
    gap: 5px;
  }
  .lg > button { grid-column: span 2; }
  .lg > .pad { grid-column: span 1; }
  .lg > button.fn.side { grid-column: span 3; }
  button:active { background: #5f6368; color: #ffffff; }
  button.accent:active { background: #aecbfa; color: #202124; }
  button.shift-on { color: #8ab4f8; }
  button.shift-caps {
    color: #8ab4f8;
    background: #3c4043;
    box-shadow: inset 0 -3px 0 #8ab4f8;
  }
</style>
</head>
<body>
<div id="kb">

  <div class="sheet active" data-sheet="letters">
    <div class="lg">
      <button data-key="q">q</button><button data-key="w">w</button>
      <button data-key="e">e</button><button data-key="r">r</button>
      <button data-key="t">t</button><button data-key="y">y</button>
      <button data-key="u">u</button><button data-key="i">i</button>
      <button data-key="o">o</button><button data-key="p">p</button>
    </div>
    <div class="lg">
      <span class="pad"></span>
      <button data-key="a">a</button><button data-key="s">s</button>
      <button data-key="d">d</button><button data-key="f">f</button>
      <button data-key="g">g</button><button data-key="h">h</button>
      <button data-key="j">j</button><button data-key="k">k</button>
      <button data-key="l">l</button>
      <span class="pad"></span>
    </div>
    <div class="lg">
      <button class="fn side" data-ui="shift">&#8679;</button>
      <button data-key="z">z</button><button data-key="x">x</button>
      <button data-key="c">c</button><button data-key="v">v</button>
      <button data-key="b">b</button><button data-key="n">n</button>
      <button data-key="m">m</button>
      <button class="fn side" data-key="backspace">&#9003;</button>
    </div>
    <div class="row">
      <button class="fn f15" data-ui="symbols">!#1</button>
      <button data-key=",">,</button>
      <button class="space" data-key="space">&#9251;</button>
      <button data-key=".">.</button>
      <button class="accent f15" data-key="enter">&#8629;</button>
    </div>
  </div>

  <div class="sheet" data-sheet="symbols-1">
    <div class="row">
      <button data-key="1">1</button><button data-key="2">2</button>
      <button data-key="3">3</button><button data-key="4">4</button>
      <button data-key="5">5</button><button data-key="6">6</button>
      <button data-key="7">7</button><button data-key="8">8</button>
      <button data-key="9">9</button><button data-key="0">0</button>
    </div>
    <div class="row">
      <button data-key="!">!</button><button data-key="@">@</button>
      <button data-key="#">#</button><button data-key="$">$</button>
      <button data-key="%">%</button><button data-key="€">€</button>
      <button data-key="&amp;">&amp;</button><button data-key="*">*</button>
      <button data-key="(">(</button><button data-key=")">)</button>
    </div>
    <div class="row">
      <button class="fn f15" data-ui="page-toggle">1/2</button>
      <button data-key="-">-</button><button data-key="'">'</button>
      <button data-key="&quot;">"</button><button data-key=":">:</button>
      <button data-key=";">;</button><button data-key=",">,</button>
      <button data-key="?">?</button>
      <button class="fn f15" data-key="backspace">&#9003;</button>
    </div>
    <div class="row">
      <button class="fn f15" data-ui="letters">ABC</button>
      <button data-key=",">,</button>
      <button class="space" data-key="space">&#9251;</button>
      <button data-key=".">.</button>
      <button class="accent f15" data-key="enter">&#8629;</button>
    </div>
  </div>

  <div class="sheet" data-sheet="symbols-2">
    <div class="row">
      <button data-key="+">+</button><button data-key="×">×</button>
      <button data-key="÷">÷</button><button data-key="=">=</button>
      <button data-key="&lt;">&lt;</button><button data-key="&gt;">&gt;</button>
      <button data-key="{">{</button><button data-key="}">}</button>
      <button data-key="[">[</button><button data-key="]">]</button>
    </div>
    <div class="row">
      <button data-key="€">€</button><button data-key="£">£</button>
      <button data-key="₩">₩</button><button data-key="/">/</button>
      <button data-key="~">~</button><button data-key="`">`</button>
      <button data-key="•">•</button><button data-key="°">°</button>
      <button data-key="❤">❤</button>
    </div>
    <div class="row">
      <button class="fn f15" data-ui="page-toggle">2/2</button>
      <button data-key="_">_</button><button data-key="\">&#92;</button>
      <button data-key="|">|</button><button data-key="¬">¬</button>
      <button data-key="¿">¿</button><button data-key="¡">¡</button>
      <button class="fn f15" data-key="backspace">&#9003;</button>
    </div>
    <div class="row">
      <button class="fn f15" data-ui="letters">ABC</button>
      <button data-key=",">,</button>
      <button class="space" data-key="space">&#9251;</button>
      <button data-key=".">.</button>
      <button class="accent f15" data-key="enter">&#8629;</button>
    </div>
  </div>

</div>
<script>
  (function () {
    var kb = document.getElementById('kb');

    function activeSheet() {
      return kb.querySelector('.sheet.active');
    }

    function setToggleLabel(sheet) {
      var toggler = kb.querySelector('[data-ui="page-toggle"]');
      if (toggler) {
        toggler.textContent = sheet === 'symbols-1' ? '1/2' : '2/2';
      }
    }

    // ---- shift: one-shot on first tap, caps lock on double tap ----
    var SHIFT_OFF = 0, SHIFT_ONESHOT = 1, SHIFT_CAPS = 2;
    var shiftMode = SHIFT_OFF;

    function isLetterKey(ch) {
      return ch.length === 1 && ((ch >= 'a' && ch <= 'z') || (ch >= 'A' && ch <= 'Z'));
    }

    function renderCase() {
      var keys = activeSheet().querySelectorAll('button[data-key]');
      for (var i = 0; i < keys.length; i++) {
        var key = keys[i];
        var ch = key.getAttribute('data-key');
        if (isLetterKey(ch)) {
          var shown = shiftMode > SHIFT_OFF ? ch.toUpperCase() : ch.toLowerCase();
          key.textContent = shown;
          key.setAttribute('data-key', shown);
        }
      }
    }

    function paintShift() {
      var shifter = activeSheet().querySelector('[data-ui="shift"]');
      if (shifter) {
        shifter.classList.toggle('shift-on', shiftMode === SHIFT_ONESHOT);
        shifter.classList.toggle('shift-caps', shiftMode === SHIFT_CAPS);
      }
    }

    function toggleShift() {
      shiftMode = (shiftMode + 1) % 3;
      paintShift();
      renderCase();
    }

    function releaseShift() {
      if (shiftMode !== SHIFT_ONESHOT) {
        return;
      }
      shiftMode = SHIFT_OFF;
      paintShift();
      renderCase();
    }

    // ---- sheets and page toggle ----
    function showSheet(name) {
      var sheets = kb.querySelectorAll('.sheet');
      for (var s = 0; s < sheets.length; s++) {
        sheets[s].classList.toggle(
                'active', sheets[s].getAttribute('data-sheet') === name);
      }
      paintShift();
      renderCase();
      setToggleLabel(name);
    }

    function togglePage() {
      showSheet(activeSheet().getAttribute('data-sheet') === 'symbols-1'
              ? 'symbols-2' : 'symbols-1');
    }

    // ---- wiring ----
    kb.addEventListener('click', function (event) {
      var target = event.target;
      if (!target || target.tagName !== 'BUTTON') {
        return;
      }
      event.preventDefault();
      var ui = target.getAttribute('data-ui');
      if (ui === 'shift') {
        toggleShift();
        return;
      }
      if (ui === 'symbols') {
        showSheet('symbols-1');
        return;
      }
      if (ui === 'letters') {
        showSheet('letters');
        return;
      }
      if (ui === 'page-toggle') {
        togglePage();
        return;
      }
      var key = target.getAttribute('data-key');
      if (key) {
        KeyboardBridge.onKey(key);
        releaseShift();
      }
    });

    renderCase();
  })();
</script>
</body>
</html>
