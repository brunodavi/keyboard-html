<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  html, body { margin:0; padding:0; background:#155e3f; font-family:sans-serif;
    -webkit-user-select:none; user-select:none; touch-action:manipulation;
    -webkit-tap-highlight-color:transparent; }
  #kb { display:flex; flex-direction:column; gap:5px; padding:5px; }
  .row { display:flex; gap:4px; }
  button { flex:1; max-width:44px; height:46px; font-size:17px; color:#e2fff0;
    background:#1e7a52; border:0; border-radius:7px; }
  button.act { max-width:64px; background:#186343; font-size:13px; }
  button.wide { max-width:60%; background:#186343; }
  button:active { background:#7dffc2; color:#0c3b28; }
</style>
</head>
<body>
<div id="kb">
  <div class="row" data-keys="12345"></div>
  <div class="row" data-keys="67890"></div>
  <div class="row">
    <button class="act" data-key="backspace">BKSP</button>
    <button class="wide" data-key="space">SPACE</button>
    <button class="act" data-key="enter">ENTER</button>
  </div>
</div>
<script>
  (function () {
    var rows = document.querySelectorAll('.row[data-keys]');
    for (var r = 0; r < rows.length; r++) {
      var keys = rows[r].getAttribute('data-keys').split('');
      for (var i = 0; i < keys.length; i++) {
        var key = document.createElement('button');
        key.textContent = keys[i];
        key.setAttribute('data-key', keys[i]);
        rows[r].appendChild(key);
      }
    }
    document.addEventListener('click', function (event) {
      var target = event.target;
      if (target && target.getAttribute && target.getAttribute('data-key')) {
        event.preventDefault();
        KeyboardBridge.onKey(target.getAttribute('data-key'));
      }
    });
  })();
</script>
</body>
</html>
